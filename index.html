<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alerta & Mensagens - Loja</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent-red: #d32f2f;
      --accent-blue: #1976d2;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --msg-me: #1e3a5f;
      --msg-other: #2c2c2c;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-card {
      background: var(--card);
      width: 100%;
      max-width: 380px;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }
    p { color: var(--subtext); font-size: 12px; margin-bottom: 15px; text-align: center; }

    label {
      font-size: 11px;
      color: var(--subtext);
      text-transform: uppercase;
      display: block;
      margin: 10px 0 4px 0;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent-blue);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-help {
      background: var(--accent-red);
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      width: 100%;
      border: none;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
    }

    .chat-box {
      height: 180px;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      background: #181818;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .message {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.3;
      word-wrap: break-word;
    }

    .message.me {
      align-self: flex-end;
      background: var(--msg-me);
      color: #e3f2fd;
    }

    .message.other {
      align-self: flex-start;
      background: var(--msg-other);
      color: #ddd;
    }

    .msg-header {
      font-weight: bold;
      font-size: 10px;
      color: var(--subtext);
      margin-bottom: 3px;
    }

    .chat-input-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .chat-input-group input { flex: 1; }
    .chat-input-group button { width: auto; padding: 0 16px; margin: 0; }

    .hidden { display: none !important; }
    .badge {
      font-size: 10px;
      background: #2e7d32;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="screenLogin" class="app-card">
    <h2>🔒 Login da Loja</h2>
    <p>Insira o PIN para acessar.</p>
    
    <input type="password" id="pinInput" placeholder="PIN da Loja" maxlength="8">
    
    <label for="userSelect">Seu Usuário / Aparelho:</label>
    <select id="userSelect">
      <option value="NOTEBOOK">💻 Notebook</option>
      <option value="COMPUTADOR">🖥️ Computador</option>
      <option value="Jhenifer">📱 Jhenifer</option>
      <option value="Jeniffer">📱 Jeniffer</option>
      <option value="Angelo">📱 Angelo</option>
      <option value="Lia">📱 Lia</option>
      <option value="Leo">📱 Leo</option>
      <option value="Lu">📱 Lu</option>
      <option value="Caixa">💳 Caixa</option>
      <option value="Estoque">📦 Estoque</option>
    </select>

    <button class="btn-main" onclick="autenticar()">ENTRAR</button>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="screenApp" class="app-card hidden">
    <div style="text-align: center;">
      <span class="badge">🔔 Alertas & Som Ativos</span>
    </div>

    <!-- BOTÃO DE AJUDA -->
    <button class="btn-help" onclick="enviarAlertaRapido()">⚡ PEDIR AJUDA URGENTE</button>

    <!-- DESTINATÁRIO -->
    <label for="destinatarioSelect">Enviar Notificação Para:</label>
    <select id="destinatarioSelect">
      <option value="TODOS">📢 TODOS OS USUÁRIOS</option>
      <option value="NOTEBOOK">💻 Notebook</option>
      <option value="COMPUTADOR">🖥️ Computador</option>
      <option value="Jhenifer">📱 Jhenifer</option>
      <option value="Jeniffer">📱 Jeniffer</option>
      <option value="Angelo">📱 Angelo</option>
      <option value="Lia">📱 Lia</option>
      <option value="Leo">📱 Leo</option>
      <option value="Lu">📱 Lu</option>
      <option value="Caixa">💳 Caixa</option>
      <option value="Estoque">📦 Estoque</option>
    </select>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">
      <div class="message other">
        <div class="msg-header">SISTEMA</div>
        Conectado na nova porta privada.
      </div>
    </div>

    <div class="chat-input-group">
      <input type="text" id="msgInput" placeholder="Digite uma mensagem..." onkeypress="checarEnter(event)">
      <button class="btn-main" onclick="enviarMensagemCustom()">Enviar</button>
    </div>
  </div>

  <script>
    const PIN_CORRETO = "1234";
    const CHAVE_SECRETA = "ChaveCriptoLoja2026";
    // Canal atualizado para evitar conflito com mensagens antigas
    const CANAL_BASE = "loja-casual-chique-v3-privado";

    let usuarioAtual = "";
    let eventSource = null;
    let audioCtx = null;

    function inicializarAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function tocarSomNotificacao() {
      try {
        inicializarAudio();
        if (!audioCtx) return;

        function tocarNota(freq, inicio, duracao) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + inicio);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + inicio);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + inicio + duracao);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + inicio);
          osc.stop(audioCtx.currentTime + inicio + duracao);
        }

        tocarNota(783.99, 0.0, 0.35);
        tocarNota(523.25, 0.2, 0.5);
      } catch (e) {
        console.error("Erro ao tocar som:", e);
      }
    }

    function autenticar() {
      const pin = document.getElementById('pinInput').value;
      if (pin === PIN_CORRETO) {
        usuarioAtual = document.getElementById('userSelect').value;
        document.getElementById('screenLogin').classList.add('hidden');
        document.getElementById('screenApp').classList.remove('hidden');
        inicializarAudio();
        iniciarConexaoSSE();
      } else {
        alert("PIN incorreto.");
      }
    }

    function criptografar(texto) {
      let res = "";
      for (let i = 0; i < texto.length; i++) {
        res += String.fromCharCode(texto.charCodeAt(i) ^ CHAVE_SECRETA.charCodeAt(i % CHAVE_SECRETA.length));
      }
      return btoa(res);
    }

    function descriptografar(base64Str) {
      try {
        let str = atob(base64Str);
        let res = "";
        for (let i = 0; i < str.length; i++) {
          res += String.fromCharCode(str.charCodeAt(i) ^ CHAVE_SECRETA.charCodeAt(i % CHAVE_SECRETA.length));
        }
        return res;
      } catch (e) {
        return null;
      }
    }

    async function transmitirMensagem(texto, destinatario) {
      const pacotePuro = JSON.stringify({
        de: usuarioAtual,
        para: destinatario,
        texto: texto,
        timestamp: Date.now()
      });

      const payloadCriptografado = criptografar(pacotePuro);

      await fetch(`https://ntfy.sh/${CANAL_BASE}`, {
        method: 'POST',
        body: payloadCriptografado
      });
    }

    function enviarAlertaRapido() {
      const dest = document.getElementById('destinatarioSelect').value;
      transmitirMensagem("🚨 PRECISO DE AJUDA URGENTE!", dest);
    }

    function enviarMensagemCustom() {
      const input = document.getElementById('msgInput');
      const texto = input.value.trim();
      const dest = document.getElementById('destinatarioSelect').value;

      if (texto !== "") {
        transmitirMensagem(texto, dest);
        input.value = "";
      }
    }

    function checarEnter(e) {
      if (e.key === 'Enter') enviarMensagemCustom();
    }

    function iniciarConexaoSSE() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(`https://ntfy.sh/${CANAL_BASE}/sse`);

      eventSource.onmessage = (event) => {
        try {
          const ntfyData = JSON.parse(event.data);
          if (ntfyData.event !== "message") return;

          const pacoteDecifrado = descriptografar(ntfyData.message);
          if (!pacoteDecifrado) return;

          const dados = JSON.parse(pacoteDecifrado);

          // Filtro: exibe apenas se for destinado a TODOS, ao usuário atual, ou enviado por ele
          if (dados.para === "TODOS" || dados.para === usuarioAtual || dados.de === usuarioAtual) {
            adicionarMensagemChat(dados);
          }
        } catch (e) {
          // Ignora mensagens malformadas
        }
      };
    }

    function adicionarMensagemChat(dados) {
      const chatBox = document.getElementById('chatBox');
      const eMinha = dados.de === usuarioAtual;

      const div = document.createElement('div');
      div.className = `message ${eMinha ? 'me' : 'other'}`;

      const destinoRotulo = dados.para !== "TODOS" ? ` ➔ ${dados.para}` : " ➔ TODOS";
      div.innerHTML = `<div class="msg-header">${dados.de}${destinoRotulo}</div>${dados.texto}`;

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Somente toca o alarme se a mensagem NÃO for enviada pelo próprio usuário
      if (!eMinha) {
        tocarSomNotificacao();
        if (navigator.vibrate) navigator.vibrate([150, 100, 150]);
      }
    }
  </script>
</body>
</html>
