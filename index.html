<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicação - Loja</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --card-bg: #ffffff;
      --accent: #1f1f1f;
      --text: #222222;
      --subtext: #666666;
      --msg-me: #e3f2fd;
      --msg-other: #f0f0f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .header h2 {
      font-weight: 300;
      letter-spacing: 2px;
      margin: 0 0 5px 0;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    
    /* CHAT BOX */
    .chat-box {
      height: 220px;
      overflow-y: auto;
      border: 1px solid #eaeaea;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .message.me {
      align-self: flex-end;
      background: var(--msg-me);
      color: #0d47a1;
      border-bottom-right-radius: 2px;
    }
    .message.other {
      align-self: flex-start;
      background: var(--msg-other);
      color: #333;
      border-bottom-left-radius: 2px;
    }
    .msg-author {
      font-weight: bold;
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.7;
    }
    .chat-input {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .chat-input input { flex: 1; }
    .chat-input button { width: auto; padding: 0 16px; }

    /* BANNER DE ALERTA */
    #banner {
      display: none;
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 12px 20px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      z-index: 1000;
      text-align: center;
      font-size: 13px;
      width: 85%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="banner"></div>

  <div class="container">
    <div class="header">
      <h2>LOJA CONECTADA</h2>
    </div>

    <div class="card">
      <label for="meuNome">Seu Aparelho / Usuário:</label>
      <select id="meuNome" onchange="salvarLogin()">
        <option value="NOTEBOOK">💻 Notebook</option>
        <option value="COMPUTADOR">🖥️ Computador</option>
        <option value="VENDEDOR 1">📱 Vendedor 1</option>
        <option value="VENDEDOR 2">📱 Vendedor 2</option>
        <option value="VENDEDOR 3">📱 Vendedor 3</option>
        <option value="ESTOQUE">📦 Estoque</option>
        <option value="CAIXA">💳 Caixa</option>
      </select>
    </div>

    <div class="card">
      <label for="destinatario">Enviar Notificação/Mensagem Para:</label>
      <select id="destinatario">
        <option value="TODOS">📢 TODOS OS APARELHOS</option>
        <option value="NOTEBOOK">💻 Notebook</option>
        <option value="COMPUTADOR">🖥️ Computador</option>
        <option value="VENDEDOR 1">📱 Vendedor 1</option>
        <option value="VENDEDOR 2">📱 Vendedor 2</option>
        <option value="VENDEDOR 3">📱 Vendedor 3</option>
        <option value="ESTOQUE">📦 Estoque</option>
        <option value="CAIXA">💳 Caixa</option>
      </select>

      <div class="btn-grid">
        <button onclick="enviarMensagem('⚡ Alerta: Preciso de ajuda!')">⚡ Pedir Ajuda</button>
        <button onclick="enviarMensagem('📦 Alerta: Trazer peça no provador')">📦 Pedir Peça</button>
      </div>
    </div>

    <div class="card">
      <label>Chat Interno</label>
      <div class="chat-box" id="chatBox">
        <div class="message other">
          <div class="msg-author">SISTEMA</div>
          Bem-vindo ao chat da loja!
        </div>
      </div>
      
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Digite uma mensagem..." onkeypress="checarEnter(event)">
        <button onclick="enviarTextoChat()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const CANAL_LOJA = "loja-casual-chique-9988";
    const selectLogin = document.getElementById('meuNome');
    const selectDestino = document.getElementById('destinatario');
    const chatBox = document.getElementById('chatBox');

    // Recupera o Login Salvo
    if (localStorage.getItem('loja_usuario')) {
      selectLogin.value = localStorage.getItem('loja_usuario');
    }

    function salvarLogin() {
      localStorage.setItem('loja_usuario', selectLogin.value);
    }

    // Som de Notificação
    function tocarChime() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(554.37, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1.0);
    }

    // Função Geral para Enviar Mensagem/Alerta
    function enviarMensagem(texto) {
      const remetente = selectLogin.value;
      const destino = selectDestino.value;

      fetch(`https://ntfy.sh/${CANAL_LOJA}`, {
        method: 'POST',
        body: JSON.stringify({
          de: remetente,
          para: destino,
          texto: texto
        })
      });
    }

    function enviarTextoChat() {
      const input = document.getElementById('chatInput');
      if (input.value.trim() !== '') {
        enviarMensagem(input.value);
        input.value = '';
      }
    }

    function checarEnter(e) {
      if (e.key === 'Enter') enviarTextoChat();
    }

    // Escutar Mensagens em Tempo Real
    const eventSource = new EventSource(`https://ntfy.sh/${CANAL_LOJA}/sse`);
    
    eventSource.onmessage = (event) => {
      try {
        const dados = JSON.parse(JSON.parse(event.data).message);
        const meuUsuario = selectLogin.value;

        // Verifica se a mensagem é para TODOS, para MIM ou enviada por MIM
        if (dados.para === 'TODOS' || dados.para === meuUsuario || dados.de === meuUsuario) {
          
          // Adiciona ao Chat
          const eMinha = dados.de === meuUsuario;
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${eMinha ? 'me' : 'other'}`;
          
          const paraTexto = dados.para !== 'TODOS' ? ` ➔ ${dados.para}` : '';
          msgDiv.innerHTML = `<div class="msg-author">${dados.de}${paraTexto}</div>${dados.texto}`;
          
          chatBox.appendChild(msgDiv);
          chatBox.scrollTop = chatBox.scrollHeight;

          // Se a mensagem veio de outra pessoa, toca o som e mostra alerta
          if (!eMinha) {
            tocarChime();
            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

            const banner = document.getElementById('banner');
            banner.innerHTML = `<strong>${dados.de}</strong> (${dados.para}):<br>${dados.texto}`;
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 4000);
          }
        }
      } catch (e) {
        // Ignora mensagens de controle do sistema
      }
    };
  </script>
</body>
</html>
