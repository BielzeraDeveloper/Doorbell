<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamador - Loja</title>
  <style>
    :root {
      --bg-color: #f7f6f2;
      --card-bg: #ffffff;
      --accent: #2c2c2c;
      --text: #1a1a1a;
      --subtext: #767676;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    label { font-size: 13px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-secondary { background: #575757; }
    
    /* Alerta visual na tela */
    #banner {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: #fff;
      padding: 16px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 1000;
      text-align: center;
      width: 80%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <div id="banner"></div>

  <div class="header">
    <h2>CHAMADOR LOJA</h2>
  </div>

  <div class="card">
    <label for="meuNome">Este aparelho é:</label>
    <select id="meuNome" onchange="salvarIdentidade()">
      <option value="NOTEBOOK">💻 Notebook</option>
      <option value="COMPUTADOR">🖥️ Computador</option>
      <option value="VENDEDOR 1">📱 Vendedor 1</option>
      <option value="VENDEDOR 2">📱 Vendedor 2</option>
      <option value="VENDEDOR 3">📱 Vendedor 3</option>
      <option value="ESTOQUE">📦 Estoque</option>
      <option value="CAIXA">💳 Caixa</option>
    </select>
  </div>

  <div class="card">
    <label>Disparar Alerta:</label>
    <button onclick="chamar('Pedir peça no Estoque')">📦 Chamar Estoque</button>
    <button class="btn-secondary" onclick="chamar('Apoio no Caixa / Troco')">💳 Chamar Caixa</button>
    <button class="btn-secondary" onclick="chamar('Ajuda geral / Atendimento')">✋ Preciso de Ajuda</button>
  </div>

  <script>
    // Substitua se quiser por um código próprio da sua loja
    const CANAL_LOJA = "loja-casual-chique-9988";

    // Salva e recupera o nome do dispositivo na memória do aparelho
    const select = document.getElementById('meuNome');
    
    if (localStorage.getItem('dispositivo_nome')) {
      select.value = localStorage.getItem('dispositivo_nome');
    }

    function salvarIdentidade() {
      localStorage.setItem('dispositivo_nome', select.value);
    }

    // Função de Som Suave (Acorde Elegante de 2 Notas)
    function tocarChimeChique() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Primeira nota (A4 - 440Hz)
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(440, ctx.currentTime);
      gain1.gain.setValueAtTime(0.08, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 1.0);

      // Segunda nota suave depois de 150ms (C#5 - 554.37Hz)
      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(554.37, ctx.currentTime);
        gain2.gain.setValueAtTime(0.08, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime);
        osc2.stop(ctx.currentTime + 1.2);
      }, 150);
    }

    // Disparar o chamado
    function chamar(motivo) {
      const quemChamou = select.value;
      
      fetch(`https://ntfy.sh/${CANAL_LOJA}`, {
        method: 'POST',
        body: JSON.stringify({ quem: quemChamou, motivo: motivo })
      });
    }

    // Escutar chamadas recebidas
    const eventSource = new EventSource(`https://ntfy.sh/${CANAL_LOJA}/sse`);
    
    eventSource.onmessage = (event) => {
      try {
        const dados = JSON.parse(JSON.parse(event.data).message);
        
        // Toca o som suave
        tocarChimeChique();

        // Vibra se for celular
        if (navigator.vibrate) {
          navigator.vibrate([100, 80, 100]);
        }

        // Exibe o banner na tela
        const banner = document.getElementById('banner');
        banner.innerHTML = `<strong>${dados.quem}</strong><br>${dados.motivo}`;
        banner.style.display = 'block';

        // Esconde o aviso depois de 5 segundos
        setTimeout(() => {
          banner.style.display = 'none';
        }, 5000);

      } catch (e) {
        // Ignora mensagens do servidor
      }
    };
  </script>
</body>
</html>
