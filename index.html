<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Alerta Loja - App</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #d32f2f;
      --accent-hover: #b71c1c;
      --text: #ffffff;
      --subtext: #a0a0a0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-card {
      background: var(--card);
      width: 100%;
      max-width: 360px;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    h2 { margin-top: 0; font-size: 20px; font-weight: 600; }
    p { color: var(--subtext); font-size: 13px; margin-bottom: 20px; }

    input, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      outline: none;
      text-align: center;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-main:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    .btn-help-big {
      height: 180px;
      border-radius: 50%;
      width: 180px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      box-shadow: 0 0 25px rgba(211, 47, 47, 0.4);
    }

    .hidden { display: none !important; }
    
    .status-tag {
      font-size: 11px;
      color: #4caf50;
      background: rgba(76, 175, 80, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- TELA 1: LOGIN SIMPLES (PIN) -->
  <div id="screenLogin" class="app-card">
    <h2>🔒 Acesso Restrito</h2>
    <p>Digite o PIN de acesso da loja para entrar.</p>
    
    <input type="password" id="pinInput" placeholder="PIN da Loja (Ex: 1234)" maxlength="8">
    <select id="userSelect">
      <option value="Jhenifer">📱 Jhenifer</option>
      <option value="Jeniffer">📱 Jeniffer</option>
      <option value="Angelo">📱 Angelo</option>
      <option value="Lia">📱 Lia</option>
      <option value="Leo">📱 Leo</option>
      <option value="Lu">📱 Lu</option>
      <option value="Caixa">💳 Caixa</option>
    </select>

    <button class="btn-main" onclick="autenticar()">ENTRAR NO APP</button>
  </div>

  <!-- TELA 2: BOTÃO DE SOCORRO -->
  <div id="screenApp" class="app-card hidden">
    <h2>SISTEMA DE ALERTA</h2>
    <span class="status-tag">🔒 Conexão Criptografada</span>
    
    <button class="btn-main btn-help-big" onclick="dispararAlerta()">
      🚨<br>PRECISO DE AJUDA
    </button>

    <p id="feedbackText">Pressione o botão acima para notificar a equipe em tempo real.</p>
  </div>

  <script>
    // Configurações Globais
    const PIN_CORRETO = "1234"; // Defina o PIN simples da loja aqui
    const CHAVE_CRIPTOGRAFICA = "ChaveSuperSecretaLoja2026";
    const CANAL_NTFY = "loja-casual-chique-a8f92k19-alerta";

    let usuarioAtual = "";

    function autenticar() {
      const pinDigitado = document.getElementById('pinInput').value;
      if (pinDigitado === PIN_CORRETO) {
        usuarioAtual = document.getElementById('userSelect').value;
        document.getElementById('screenLogin').classList.add('hidden');
        document.getElementById('screenApp').classList.remove('hidden');
      } else {
        alert("PIN Incorreto! Acesso negado.");
      }
    }

    // Função simples para criptografar texto antes do envio (Base64 + Cifra Básica)
    function criptografar(texto, chave) {
      let resultado = "";
      for (let i = 0; i < texto.length; i++) {
        let charCode = texto.charCodeAt(i) ^ chave.charCodeAt(i % chave.length);
        resultado += String.fromCharCode(charCode);
      }
      return btoa(resultado); // Converte para Base64
    }

    async function dispararAlerta() {
      const feedback = document.getElementById('feedbackText');
      feedback.innerText = "Enviando alerta criptografado...";

      const mensagemPura = `${usuarioAtual} precisa de ajuda urgente no salão!`;
      const mensagemCriptografada = criptografar(mensagemPura, CHAVE_CRIPTOGRAFICA);

      try {
        await fetch(`https://ntfy.sh/${CANAL_NTFY}`, {
          method: 'POST',
          headers: {
            'Title': '🚨 PEDIDO DE AJUDA',
            'Priority': '5',
            'Tags': 'warning,alert'
          },
          body: JSON.stringify({
            remetente: usuarioAtual,
            payload: mensagemCriptografada
          })
        });

        feedback.innerText = "✅ Alerta enviado para todos os aparelhos!";
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

        setTimeout(() => {
          feedback.innerText = "Pressione o botão acima para notificar a equipe em tempo real.";
        }, 4000);

      } catch (err) {
        feedback.innerText = "❌ Falha ao enviar alerta. Verifique a internet.";
      }
    }
  </script>
</body>
</html>
